# Auto Tune entry for the Klipper LCD menu.
#
# Add "[include autotuner_menu.cfg]" to printer.cfg (after [display]).
#
#   Main
#     + Auto Tune
#         + Start / Continue / Abort
#         + Limits: ON/OFF
#         + Input shaper: ON/OFF
#         + Probe offsets: ON/OFF
#         + Jog X / Jog Y / Jog Z
#         + Paper test: Test Z / Accept / Abort

[menu __main __autotune]
type: list
enable: {("autotuner" in printer) and (printer.autotuner.active or printer.idle_timeout.state != "Printing")}
name: Auto Tune

[menu __main __autotune __start]
type: command
enable: {not printer.autotuner.active}
name: Start
gcode: TUNE_START

[menu __main __autotune __status]
type: command
enable: {printer.autotuner.active}
name: {printer.autotuner.message}
gcode: TUNE

[menu __main __autotune __continue]
type: command
enable: {printer.autotuner.waiting}
name: Continue
gcode: TUNE_CONTINUE

[menu __main __autotune __abort]
type: command
enable: {printer.autotuner.active}
name: Abort tune
gcode: TUNE_ABORT

[menu __main __autotune __limits]
type: input
enable: {not printer.autotuner.active}
name: Limits: {'ON ' if menu.input else 'OFF'}
input: {1 if printer.autotuner.limits else 0}
input_min: 0
input_max: 1
input_step: 1
gcode: TUNE_ENABLE ITEM=limits ENABLE={menu.input|int}

[menu __main __autotune __input_shaper]
type: input
enable: {not printer.autotuner.active}
name: Shaper: {'ON ' if menu.input else 'OFF'}
input: {1 if printer.autotuner.input_shaper else 0}
input_min: 0
input_max: 1
input_step: 1
gcode: TUNE_ENABLE ITEM=input_shaper ENABLE={menu.input|int}

[menu __main __autotune __probe_offsets]
type: input
enable: {not printer.autotuner.active}
name: Probe ofs: {'ON ' if menu.input else 'OFF'}
input: {1 if printer.autotuner.probe_offsets else 0}
input_min: 0
input_max: 1
input_step: 1
gcode: TUNE_ENABLE ITEM=probe_offsets ENABLE={menu.input|int}

# Jog items: select a distance, click to move by that amount
[menu __main __autotune __jog_x]
type: input
enable: {printer.autotuner.waiting}
name: Jog X: {['-50','-10','-1','-0.1','0','+0.1','+1','+10','+50'][menu.input|int]}
input: 4
input_min: 0
input_max: 8
input_step: 1
gcode: TUNE_JOG X={[-50,-10,-1,-0.1,0,0.1,1,10,50][menu.input|int]}

[menu __main __autotune __jog_y]
type: input
enable: {printer.autotuner.waiting}
name: Jog Y: {['-50','-10','-1','-0.1','0','+0.1','+1','+10','+50'][menu.input|int]}
input: 4
input_min: 0
input_max: 8
input_step: 1
gcode: TUNE_JOG Y={[-50,-10,-1,-0.1,0,0.1,1,10,50][menu.input|int]}

[menu __main __autotune __jog_z]
type: input
enable: {printer.autotuner.waiting}
name: Jog Z: {['-50','-10','-1','-0.1','0','+0.1','+1','+10','+50'][menu.input|int]}
input: 4
input_min: 0
input_max: 8
input_step: 1
gcode: TUNE_JOG Z={[-50,-10,-1,-0.1,0,0.1,1,10,50][menu.input|int]}

[menu __main __autotune __motors_off]
type: command
enable: {printer.autotuner.waiting and printer.autotuner.item == 'limits'}
name: Motors off
gcode: M84

# Paper test (Z offset) - same controls as Klipper's manual probe
[menu __main __autotune __test_z]
type: input
enable: {printer.autotuner.manual_probe}
name: Test Z: {['++','+','+.01','+.05','+.1','+.5','-.5','-.1','-.05','-.01','-','--'][menu.input|int]}
input: 6
input_min: 0
input_max: 11
input_step: 1
gcode: TESTZ Z={['++','+','+.01','+.05','+.1','+.5','-.5','-.1','-.05','-.01','-','--'][menu.input|int]}

[menu __main __autotune __accept]
type: command
enable: {printer.autotuner.manual_probe}
name: Accept
gcode: ACCEPT

[menu __main __autotune __probe_abort]
type: command
enable: {printer.autotuner.manual_probe}
name: Abort paper test
gcode: ABORT
