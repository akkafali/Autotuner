# Example Auto Tune configuration.
#
# Copy this file next to printer.cfg and add to printer.cfg:
#   [include autotuner.cfg]
#   [include autotuner_menu.cfg]    # optional, only for a printer LCD
#
# This adds buttons to the Macros panel of Mainsail and Fluidd:
#   TUNE                - opens the Auto Tune list (switch items ON/OFF, Start)
#   TUNE_LIMITS         - runs only the limit calibration
#   TUNE_INPUT_SHAPER   - runs only the input shaper calibration
#   TUNE_PROBE_OFFSETS  - runs only the bed probe offset calibration
# The single-item buttons run their item even when it is OFF in the list.

[gcode_macro TUNE]
description: Auto Tune: limits, input shaper and probe offsets
gcode:
    TUNE_MENU

[gcode_macro TUNE_LIMITS]
description: Auto Tune: measure the length of each axis
gcode:
    TUNE_START ITEM=limits

[gcode_macro TUNE_INPUT_SHAPER]
description: Auto Tune: find and apply the best input shapers
gcode:
    TUNE_START ITEM=input_shaper

[gcode_macro TUNE_PROBE_OFFSETS]
description: Auto Tune: measure the probe X/Y/Z offsets
gcode:
    TUNE_START ITEM=probe_offsets

# Every option below is optional, the values shown are the defaults.

[autotuner]
# Which items are enabled when Klipper starts. Each item can also be
# switched on/off from the menu or with TUNE_ENABLE ITEM=<name> ENABLE=<0|1>.
#limits: True
#input_shaper: True
#probe_offsets: True

# Run SAVE_CONFIG (which restarts Klipper) after all items finished.
#save_config: True
# Show Mainsail / Fluidd pop-up dialogs with Continue / Abort / jog buttons.
#web_prompts: True
#jog_speed: 50
#travel_speed: 100
# Z height used when travelling to the probe point.
#safe_z: 10

# --- Limit calibration ---
# Axes to measure.
#limit_axes: xyz
# For X and Y endstops at the minimum: put the switch at 0 (position_endstop
# and position_min become 0, position_max becomes the measured length).
# When False, position_max = position_endstop + measured length.
# Z always keeps its position_endstop (it holds your nozzle height).
#zero_at_switch: True
# Longest distance (mm) an axis may move while looking for the switch.
# Default: 1.5 x the configured axis length.
#limit_max_travel:
# Measured lengths below this (mm) are rejected as a mistake.
#limit_min_travel: 10

# --- Input shaper ---
# Needs a working [resonance_tester] section.
# auto: two accelerometers when [resonance_tester] has different
# accel_chip_x and accel_chip_y, otherwise one (the run pauses after X so you
# can move the accelerometer to the Y axis).
#accelerometers: auto
# Optional: accelerometer chips to pass as CHIPS= to SHAPER_CALIBRATE.
#accel_chip_x: adxl345 toolhead
#accel_chip_y: adxl345 bed
#max_smoothing:

# --- Bed probe offsets ---
# Probe config section to save x_offset / y_offset / z_offset to
# (auto-detected: probe, bltouch, smart_effector, probe_eddy_current ...).
#probe_section: bltouch
# Toolhead X,Y used for the post-it mark and the Z paper test.
# Default: the middle of the bed.
#probe_point: 117.5, 117.5
# How far the probe lifts after touching the post-it / bed.
#probe_lift: 5
